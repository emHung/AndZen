name: SonarQube analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
    steps:
      - name: Validate SonarQube configuration
        shell: bash
        run: |
          test -n "$SONAR_HOST_URL" || { echo '::error::Set repository variable SONAR_HOST_URL'; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo '::error::Set repository variable SONAR_PROJECT_KEY'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo '::error::Set repository secret SONAR_TOKEN'; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Backend tests and coverage
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt coverage==7.13.0
          python -m coverage run --source=app -m unittest discover -s tests -v
          python -m coverage xml
      - name: Build Android and analyze with quality gate
        run: bash gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest sonar -Dsonar.qualitygate.wait=true
